name: Geometry audit CLI

concurrency:
  group: geometry-audit-cli-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [V23]
  pull_request:
    branches: [V23]
  workflow_dispatch:

jobs:
  geometry-audit-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check CLI syntax
        run: node --check tools/geometry-audit-cli.js
      - name: Check browser script syntax
        run: |
          for file in decorations.js typesetter.js settings-manager.js app.js renderer-bridge.js geometry-audit.js; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Check CLI help
        run: node tools/geometry-audit-cli.js --help
      - name: Run geometry audit smoke test
        run: node tools/geometry-audit-cli.js --input ./tests/fixtures/geometry-audit-smoke.txt --report ./artifacts/smoke-report.json --summary ./artifacts/smoke-summary.md --fail-on none --repeat-check
      - name: Assert enabled step-audit mode is explicit in smoke report
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('./artifacts/smoke-report.json', 'utf8'));
          const mode = report.run?.stepAudit;
          const issues = report.audit?.issues || [];
          const falselyDisabled = issues.filter(issue =>
            issue.stepByStepTrace?.reason === 'step-audit-disabled-by-request');
          if (!mode || mode.enabled !== true || mode.disabledByRequest !== false ||
              mode.disableReason !== null || falselyDisabled.length) {
            console.error('An ordinary smoke run must record step audit as enabled and must not label traces as intentionally disabled:', {
              mode, falselyDisabled: falselyDisabled.slice(0, 10)
            });
            process.exit(1);
          }
          console.log(JSON.stringify({stepAudit: mode, issueCount: issues.length,
            enabledModeGate: 'PASS'}));
          NODE
      - name: Run no-legal-two-column-split regression fixture
        run: node tools/geometry-audit-cli.js --input ./tests/fixtures/no-legal-two-column-split.txt --report ./artifacts/no-legal-split-report.json --summary ./artifacts/no-legal-split-summary.md --fail-on none
      - name: Assert no-legal-split decision is explicit and complete
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('./artifacts/no-legal-split-report.json', 'utf8'));
          const records = report.geometry?.layoutDecisionRecords || [];
          const matches = records.filter(record => {
            const selection = record.decision?.selection;
            return selection?.status === 'skipped' &&
              selection?.routing === 'balanceColumns' &&
              selection?.skipReason === 'no-legal-two-column-split' &&
              selection?.fallback === 'full-width-terminal-residual' &&
              ['left', 'right'].includes(selection?.fallbackSide) &&
              selection?.candidateCount === 0 &&
              selection?.selectedCandidateIndex === null &&
              Number.isFinite(selection?.fallbackHeightBefore) &&
              Number.isFinite(selection?.fallbackHeightAfter);
          });
          if (matches.length === 0) {
            console.error('Expected an explicit full-width terminal-residual fallback with zero candidates, declared side, before/after heights, and no selected candidate. Records:', records.map(record => ({pageLabel: record.pageLabel, decision: record.decision?.selection})));
            process.exit(1);
          }
          const fallbacks = (report.audit?.issues || []).filter(issue =>
            issue.kind === 'structural-fallback' &&
            issue.balanceOutcome === 'full-width-terminal-residual');
          if (!fallbacks.some(issue => issue.fallbackValid === true && issue.severity === 'low')) {
            console.error('Expected the geometry audit to validate the full-width residual structure:', fallbacks);
            process.exit(1);
          }
          if ((report.audit?.issues || []).some(issue =>
              issue.kind === 'imbalance' && issue.balanceOutcome === 'one-column-empty' && issue.severity === 'high')) {
            console.error('The dedicated terminal-residual fixture must not retain a high-severity empty-column finding:', report.audit.issues.filter(issue => issue.kind === 'imbalance'));
            process.exit(1);
          }
          console.log(JSON.stringify({ explicitNoLegalSplitDecisions: matches.length, validatedStructuralFallbacks: fallbacks.length, decisionContract: 'PASS' }));
          NODE
      - name: Run paragraph-balance capacity fixture followed by H3
        run: node tools/geometry-audit-cli.js --input ./tests/fixtures/balance-capacity-before-h3.txt --report ./artifacts/balance-capacity-before-h3.json --summary ./artifacts/balance-capacity-before-h3.md --fail-on none --repeat-check
      - name: Assert balance candidate ledger and stretch-capacity measurements
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('./artifacts/balance-capacity-before-h3.json', 'utf8'));
          const records = report.geometry?.layoutDecisionRecords || [];
          const evaluated = records.filter(record => {
            const selection = record.decision?.selection;
            const capacity = record.decision?.finalJustify?.capacityBefore;
            return selection?.status === 'evaluated' &&
              Array.isArray(selection.candidateTable) && selection.candidateTable.length > 0 &&
              Number.isInteger(selection.selectedCandidateIndex) &&
              capacity && Number.isFinite(capacity.right?.totalCapacity) &&
              Number.isFinite(capacity.left?.totalCapacity) &&
              Number.isFinite(record.decision?.final?.rightHeight) &&
              Number.isFinite(record.decision?.final?.leftHeight);
          });
          const badWinner = evaluated.filter(record => {
            const s = record.decision.selection;
            const tuple = c => c.score || [c.fits ? 0 : 1, c.valid ? 0 : 1,
              c.fits ? 0 : c.overflow, c.absoluteDiff, c.signedDiff >= 0 ? 0 : 1, c.k];
            const compare = (a, b) => {
              const x = tuple(a), y = tuple(b);
              for (let i = 0; i < Math.max(x.length, y.length); i++) {
                if ((x[i] ?? 0) !== (y[i] ?? 0)) return (x[i] ?? 0) - (y[i] ?? 0);
              }
              return 0;
            };
            const expected = [...s.candidateTable].sort(compare)[0];
            return expected.k !== s.selectedCandidateIndex;
          });
          const conservation = report.geometry?.textConservationAudit || {};
          const headingAudit = conservation.headingAudit || {};
          if (!evaluated.length || badWinner.length || conservation.missingSourceParagraphCount !== 0 ||
              conservation.textMismatchCount !== 0 || headingAudit.missingCount !== 0 ||
              headingAudit.mismatchCount !== 0) {
            console.error('Balance/H3 fixture did not provide a complete, internally consistent candidate/capacity record or content conservation:', {
              evaluated: evaluated.length, badWinner: badWinner.map(r => ({pageIdx:r.pageIdx, selected:r.decision.selection.selectedCandidateIndex})),
              conservation, headingAudit
            });
            process.exit(1);
          }
          console.log(JSON.stringify({
            evaluatedCandidateLedgers: evaluated.length,
            chosenCandidatesMatchRecordedLexicographicPolicy: true,
            stretchCapacityAndFinalHeightsRecorded: true,
            sourceParagraphsPreserved: true,
            headingsPreserved: true,
            repeatRenderDeterminism: report.run?.determinismCheck || null,
            fixtureGate: 'PASS'
          }));
          NODE
      - name: Run completely empty column balance regression
        run: node tools/geometry-audit-cli.js --input ./tests/fixtures/geometry-audit-smoke.txt --report ./artifacts/empty-column-report.json --summary ./artifacts/empty-column-summary.md --fail-on none --test-empty-column-balance
      - name: Assert completely empty column is reported as imbalance
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('./artifacts/empty-column-report.json', 'utf8'));
          const issues = report.audit?.issues || [];
          const emptyColumn = issues.filter(issue =>
            issue.kind === 'imbalance' &&
            issue.balanceOutcome === 'one-column-empty' &&
            issue.injectedEmptyColumnTest === true &&
            issue.rightH < 1 && issue.leftH > 1);
          if (emptyColumn.length === 0) {
            console.error('Expected the specifically tagged test block to report rightH < 1 and leftH > 1 after the right column is forced to zero height. Findings:', issues.filter(issue => issue.kind === 'imbalance'));
            process.exit(1);
          }
          if (!emptyColumn.some(issue => issue.columnGeometrySource?.right === 'live-dom-including-zero-height' ||
                                        issue.columnGeometrySource?.left === 'live-dom-including-zero-height')) {
            console.error('Expected zero-height geometry to be recovered from the live DOM:', emptyColumn);
            process.exit(1);
          }
          console.log(JSON.stringify({ emptyColumnBalanceFindings: emptyColumn.length, zeroHeightDomRecovery: 'PASS' }));
          NODE
      - name: Run missing column element regression
        run: node tools/geometry-audit-cli.js --input ./tests/fixtures/geometry-audit-smoke.txt --report ./artifacts/missing-column-report.json --summary ./artifacts/missing-column-summary.md --fail-on none --test-missing-column-element
      - name: Assert missing column is not mislabeled as empty
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('./artifacts/missing-column-report.json', 'utf8'));
          const issues = report.audit?.issues || [];
          const missing = issues.filter(issue =>
            issue.kind === 'imbalance' &&
            issue.injectedMissingColumnTest === true &&
            issue.balanceOutcome === 'missing-column-element' &&
            issue.missingColumnSide === 'left' &&
            issue.columnElementPresent?.left === false &&
            issue.severity === 'high');
          if (missing.length === 0) {
            console.error('Expected a high-severity missing-column-element finding distinct from one-column-empty:', issues.filter(issue => issue.kind === 'imbalance'));
            process.exit(1);
          }
          if (missing.some(issue => issue.balanceOutcome === 'one-column-empty')) {
            console.error('A missing DOM column must never be classified as an existing empty column:', missing);
            process.exit(1);
          }
          console.log(JSON.stringify({ missingColumnElementFindings: missing.length, distinctClassification: 'PASS' }));
          NODE
      - name: Run sparse-page and square-bracket diagnostic fixture
        run: node tools/geometry-audit-cli.js --input ./tests/fixtures/geometry-audit-diagnostics-smoke.txt --report ./artifacts/diagnostics-smoke-report.json --summary ./artifacts/diagnostics-smoke-summary.md --fail-on none
      - name: Assert sparse-page and square-bracket diagnostics
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('./artifacts/diagnostics-smoke-report.json', 'utf8'));
          const issues = report.audit?.issues || [];
          const sparse = issues.filter(issue => issue.kind === 'sparse-page');
          const brackets = issues.filter(issue => issue.kind === 'square-bracket-scope');
          // The fixture's final short chapter ends at document end. By contract,
          // document-end pages are excluded from sparse-page findings; testing a
          // chapter-start-adjusted occupancy finding belongs in a non-terminal fixture.
          if (sparse.length !== 0) {
            console.error('The final document page must be excluded from sparse-page findings. Findings:', sparse, 'audit summary:', report.audit?.summary);
            process.exit(1);
          }
          const sparsePageAudit = report.audit?.sparsePageAudit || report.audit?.diagnostics?.sparsePageAudit;
          if (sparsePageAudit && !JSON.stringify(sparsePageAudit).includes('document-end')) {
            console.error('Sparse-page audit must preserve the explicit document-end exclusion:', sparsePageAudit);
            process.exit(1);
          }
          if (brackets.length === 0) {
            console.error('Expected the cross-paragraph [] source scope to trigger square-bracket-scope; audit summary:', report.audit?.summary);
            process.exit(1);
          }
          const malformedScope = brackets.find(issue =>
            issue.startTokenId && issue.endTokenId &&
            issue.crossedParagraph !== (issue.startTokenId !== issue.endTokenId)
          );
          if (malformedScope) {
            console.error('crossedParagraph must reflect source token identity, not merely distinct DOM fragments:', malformedScope);
            process.exit(1);
          }
          if (brackets.some(issue => !Number.isInteger(issue.startFragmentIndex) || !Number.isInteger(issue.endFragmentIndex))) {
            console.error('Square-bracket scope diagnostics must include DOM fragment indexes:', brackets);
            process.exit(1);
          }
          const parenthesisScope = report.geometry?.parenthesisScopeSummary;
          if (!parenthesisScope ||
              parenthesisScope.pairedParenthesisCount < 1 ||
              parenthesisScope.unmatchedOpenCountAtDocumentEnd !== 0 ||
              parenthesisScope.unmatchedCloseCount !== 0) {
            console.error('A parenthesis pair surrounding a multi-paragraph square-bracket note must remain paired; a closing parenthesis inside the bracketed note must not close the outer scope:', parenthesisScope);
            process.exit(1);
          }
          const continuationStyled = (report.geometry?.layoutDecisionRecords || []).some(record =>
            ['right', 'left'].some(side =>
              (record.parenScopeDiagnostic?.[side]?.samples || []).some(sample =>
                sample.hasParenTextStyle && sample.preview.includes('ולאחריה מעט טקסט נוסף'))));
          if (!continuationStyled) {
            console.error('The paragraph after a cross-paragraph square-bracket note must retain the enclosing parenthesis style:', (report.geometry?.layoutDecisionRecords || []).map(record => record.parenScopeDiagnostic));
            process.exit(1);
          }
          console.log(JSON.stringify({
            sparsePageFindings: sparse.length,
            squareBracketScopeFindings: brackets.length,
            crossParagraphBracketExclusion: 'PASS',
            enclosingParenthesisContinuation: 'PASS'
          }));
          NODE
      - name: Run section-end boundary audit fixture
        run: node tools/geometry-audit-cli.js --input ./tests/fixtures/section-end-gap-audit.txt --settings ./tests/fixtures/section-end-fill-settings.json --report ./artifacts/section-end-gap-report.json --summary ./artifacts/section-end-gap-summary.md --fail-on none
      - name: Assert section-end boundary exclusions remain explicit
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('./artifacts/section-end-gap-report.json', 'utf8'));
          const audit = report.audit || {};
          const sparse = audit.checks?.sparsePage;
          const gaps = audit.checks?.containerGap;
          if (!sparse || !gaps) {
            console.error('Both sparse-page and container-gap coverage ledgers must be present:', audit.checks);
            process.exit(1);
          }
          const sectionEndSparse = (sparse.excludedPages || []).filter(item => item.reason === 'section-end-before-divider');
          const sectionEndGaps = (gaps.excludedPages || []).filter(item => item.reason === 'section-end-before-divider');
          if (!sectionEndSparse.length || !sectionEndGaps.length) {
            console.error('The explicit terminal section divider must be classified in both audits:', {
              sparsePage: sparse.excludedPages,
              containerGap: gaps.excludedPages,
              issues: audit.issues
            });
            process.exit(1);
          }
          const sparsePageIndexes = new Set(sectionEndSparse.map(item => item.pageIdx));
          const gapPageIndexes = new Set(sectionEndGaps.map(item => item.pageIdx));
          const wronglyReported = (audit.issues || []).filter(issue =>
            (issue.kind === 'sparse-page' && sparsePageIndexes.has(issue.pageIdx)) ||
            (issue.kind === 'container-gap' && gapPageIndexes.has(issue.pageIdx)));
          if (wronglyReported.length) {
            console.error('Section-end exclusions must not simultaneously remain as sparse-page/container-gap findings:', wronglyReported);
            process.exit(1);
          }
          console.log(JSON.stringify({
            sectionEndSparseExclusions: sectionEndSparse.length,
            sectionEndContainerGapExclusions: sectionEndGaps.length,
            explicitBoundaryClassification: 'PASS'
          }));
          NODE
      - name: Run active-ornament geometry smoke test
        run: node tools/geometry-audit-cli.js --input ./tests/fixtures/ornament-geometry-smoke.txt --settings ./tests/fixtures/ornament-geometry-settings.json --report ./artifacts/ornament-smoke-report.json --summary ./artifacts/ornament-smoke-summary.md --fail-on none --require-geometry-features
      - name: Assert active geometry gate policy is explicit
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('./artifacts/ornament-smoke-report.json', 'utf8'));
          const gate = report.run?.activeGeometryGate;
          if (!gate || gate.enabled !== true || gate.passed !== true) {
            console.error('Active geometry gate must be enabled and pass in the ornament smoke fixture:', gate);
            process.exit(1);
          }
          if (!Number.isInteger(gate.nonBlockingContainmentRoundingCount) ||
              !Number.isInteger(gate.blockingUnexpectedContainmentRoundingCount) ||
              typeof gate.nonBlockingContainmentRoundingPolicy !== 'string') {
            console.error('Active geometry gate must report its explicit rounding policy and counts:', gate);
            process.exit(1);
          }
          const rounding = (report.audit?.issues || []).filter(issue => issue.kind === 'containment-rounding');
          const eligible = issue => issue.childType === 'note-marker' &&
            Number.isFinite(issue.overflowPx) && issue.overflowPx >= 0 && issue.overflowPx <= 3;
          const unexpected = rounding.filter(issue => !eligible(issue));
          if (unexpected.length) {
            console.error('Unexpected containment-rounding records must not be silently waived:', unexpected);
            process.exit(1);
          }
          if (gate.nonBlockingContainmentRoundingCount !== rounding.length ||
              gate.blockingUnexpectedContainmentRoundingCount !== 0) {
            console.error('Gate counts must match the audited rounding findings:', { gate, rounding: rounding.length });
            process.exit(1);
          }
          console.log(JSON.stringify({ activeGeometryGate: 'PASS', roundingFindings: rounding.length,
            nonBlockingPolicy: gate.nonBlockingContainmentRoundingPolicy }));
          NODE
      - name: Run distinct recto/verso header geometry smoke test
        run: node tools/geometry-audit-cli.js --input ./tests/fixtures/ornament-geometry-parity-smoke.txt --settings ./tests/fixtures/ornament-geometry-parity-settings.json --report ./artifacts/ornament-parity-report.json --summary ./artifacts/ornament-parity-summary.md --fail-on none --require-geometry-features
      - name: Run active H2 title top/bottom geometry smoke test
        run: node tools/geometry-audit-cli.js --input ./tests/fixtures/ornament-geometry-smoke.txt --settings ./tests/fixtures/ornament-geometry-title-tb-settings.json --report ./artifacts/ornament-title-tb-report.json --summary ./artifacts/ornament-title-tb-summary.md --fail-on none --require-geometry-features
      - name: Upload smoke reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geometry-audit-smoke-report
          path: |
            artifacts/smoke-report.json
            artifacts/smoke-summary.md
            artifacts/no-legal-split-report.json
            artifacts/no-legal-split-summary.md
            artifacts/diagnostics-smoke-report.json
            artifacts/diagnostics-smoke-summary.md
            artifacts/ornament-smoke-report.json
            artifacts/ornament-smoke-summary.md
            artifacts/ornament-parity-report.json
            artifacts/ornament-parity-summary.md
            artifacts/ornament-title-tb-report.json
            artifacts/ornament-title-tb-summary.md
          if-no-files-found: ignore
