name: Geometry audit long document

permissions:
  contents: write

concurrency:
  group: geometry-audit-long-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [V23]
    paths:
      - 'typesetter.js'
      - 'style.css'
      - 'decorations.js'
      - 'app.js'
      - 'index.html'
      - 'default_settings.json'
      - 'geometry-audit.js'
      - 'renderer-bridge.js'
      - 'tools/geometry-audit-cli.js'
      - 'tools/build_layout_issue_screenshot_report.py'
      - 'very_long_test_text.txt'
      - 'package.json'
      - '.github/workflows/geometry-audit-long.yml'
  workflow_dispatch:

jobs:
  geometry-audit-long:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check geometry audit CLI
        run: node --check tools/geometry-audit-cli.js
      - name: Install dependencies
        run: npm install
      - name: Syntax-check screenshot PDF builder
        run: python -m py_compile tools/build_layout_issue_screenshot_report.py
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify long input
        run: |
          test -s ./very_long_test_text.txt
          wc -c ./very_long_test_text.txt
      - name: Record reproducible run fingerprint
        run: |
          mkdir -p artifacts
          node - <<'NODE'
          const fs = require('node:fs');
          fs.writeFileSync('artifacts/run-fingerprint.json', JSON.stringify({
            repository: process.env.GITHUB_REPOSITORY,
            ref: process.env.GITHUB_REF,
            sha: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            runnerOs: process.env.RUNNER_OS,
            nodeVersion: process.version,
            workflow: '.github/workflows/geometry-audit-long.yml'
          }, null, 2));
          NODE
      - name: Run long-document geometry audit
        run: npm run audit:geometry:long -- --fail-on high --repeat-check --step-audit-disabled --require-note-marker-line-diagnostics --screenshots-dir ./artifacts/issue-screenshots/default --screenshot-label default
      - name: Assert step-audit suppression is explicit in default full-document report
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          for (const file of ['./artifacts/geometry-audit.json']) {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            const mode = report.run?.stepAudit;
            const issues = report.audit?.issues || [];
            const malformed = issues.filter(issue =>
              issue.stepByStepTrace?.traceAvailable !== false ||
              issue.stepByStepTrace?.reason !== 'step-audit-disabled-by-request' ||
              typeof issue.stepByStepTrace?.detail !== 'string' ||
              !issue.stepByStepTrace.detail.includes('Full-document workflow disables step tracing'));
            if (!mode || mode.enabled !== false || mode.disabledByRequest !== true ||
                mode.disableReason !== 'full-document-stability-policy' || malformed.length) {
              console.error('Full-document trace suppression must be explicit and must not look like missing instrumentation:', {
                file, mode, issueCount: issues.length, malformedTraceSamples: malformed.slice(0, 10)
              });
              process.exit(1);
            }
            console.log(JSON.stringify({file, stepAudit: mode, issueCount: issues.length,
              allIssuesExplicitlyMarkedTraceDisabled: true, tracePolicyGate: 'PASS'}));
          }
          NODE
      - name: Assert terminal residual fallbacks do not leave sparse last lines
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('./artifacts/geometry-audit.json', 'utf8'));
          const records = report.geometry?.layoutDecisionRecords || [];
          const residuals = records.filter(record =>
            record.decision?.selection?.fallback === 'full-width-terminal-residual');
          const unresolved = residuals.filter(record =>
            record.decision?.selection?.fallbackSparseLine === 'unresolved');
          const sparseFallbacks = (report.audit?.issues || []).filter(issue =>
            issue.kind === 'sparse-line' &&
            issue.balanceFallback === 'full-width-terminal-residual');
          if (unresolved.length || sparseFallbacks.length) {
            console.error('A full-width terminal residual still has a sparse final line or an unresolved density decision.', {
              unresolved: unresolved.map(record => ({
                pageLabel: record.pageLabel,
                selection: record.decision?.selection
              })),
              sparseFallbacks
            });
            process.exit(1);
          }
          console.log(JSON.stringify({
            terminalResidualFallbacks: residuals.length,
            sparseLineCorrections: residuals.filter(record =>
              record.decision?.selection?.fallbackSparseLine === 'corrected').length,
            sparseLineGate: 'PASS'
          }));
          NODE
      - name: Assert ornament fixture targets body headings, not running headers
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const file = './tests/fixtures/ornament-geometry-settings.json';
          const settings = JSON.parse(fs.readFileSync(file, 'utf8'));
          const headerKeys = [
            'hdr-r-type', 'hdr-c-type', 'hdr-l-type',
            'hdr-verso-r-type', 'hdr-verso-c-type', 'hdr-verso-l-type'
          ];
          const activeHeaderOrnaments = headerKeys.filter(key =>
            settings[key] && settings[key] !== 'none' && settings[key] !== 'text');
          const bodyOrnaments = [
            'h2-ornament-top-style', 'h2-ornament-bottom-style',
            'h2-title-ornament-r', 'h3-ornament-r', 'h3-ornament-l'
          ];
          const inactiveBodyOrnaments = bodyOrnaments.filter(key =>
            !settings[key] || settings[key] === 'none');
          if (activeHeaderOrnaments.length || inactiveBodyOrnaments.length) {
            console.error('Ornament fixture must exercise body-text headings while disabling running-header ornaments:', {
              activeHeaderOrnaments: activeHeaderOrnaments.map(key => ({key, value: settings[key]})),
              inactiveBodyOrnaments: inactiveBodyOrnaments.map(key => ({key, value: settings[key]}))
            });
            process.exit(1);
          }
          console.log(JSON.stringify({
            runningHeaderOrnaments: 'disabled',
            bodyTextOrnamentSettings: Object.fromEntries(bodyOrnaments.map(key => [key, settings[key]])),
            scopeGate: 'PASS'
          }));
          NODE
      - name: Run long-document geometry audit with active ornaments
        run: |
          node tools/geometry-audit-cli.js \
            --input ./very_long_test_text.txt \
            --settings ./tests/fixtures/ornament-geometry-settings.json \
            --timeout-ms 900000 \
            --report ./artifacts/geometry-audit-ornaments.json \
            --summary ./artifacts/geometry-audit-ornaments-summary.md \
            --fail-on high \
            --repeat-check \
            --step-audit-disabled \
            --require-ornaments \
            --require-note-marker-line-diagnostics \
            --screenshots-dir ./artifacts/issue-screenshots/ornaments \
            --screenshot-label ornaments
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('./artifacts/geometry-audit-ornaments.json', 'utf8'));
          const features = report.geometry?.decorativeGeometryDomCoverage || {};
          const required = ['sectionDivider', 'noteRule', 'topHeader', 'topHeaderDivider'];
          const missing = required.filter(key => !(features[key] > 0));
          if (missing.length) {
            console.error('Required long-document divider/header geometry missing or zero:', {
              missing,
              measured: features
            });
            process.exit(1);
          }
          console.log(JSON.stringify({
            activeOrnamentCoverage: report.geometry?.ornamentDomCoverage || {},
            decorativeGeometryCoverage: features,
            dividerHeaderGate: 'PASS'
          }));
          NODE
      - name: Assert note-marker rounding exceptions are narrow and fully accounted
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const cases = [
            {file:'./artifacts/geometry-audit.json', expectedPages:[503,601]},
            {file:'./artifacts/geometry-audit-ornaments.json', expectedPages:[515,529,608]}
          ];
          const nearZero = value => Number.isFinite(value) && value >= 0 && value <= 0.25;
          for (const item of cases) {
            const report = JSON.parse(fs.readFileSync(item.file,'utf8'));
            const check = report.audit?.checks?.containmentRounding;
            const issues = report.audit?.issues || [];
            const records = check?.toleratedRecords;
            const validRecord = r => r &&
              r.kind === 'tolerated-containment-rounding' &&
              r.reason === 'superscript-note-marker-top-protrusion-within-tolerance' &&
              Number.isInteger(r.pageIdx) &&
              ['p-cut','p-end'].includes(r.parentType) &&
              r.childType === 'note-marker' &&
              r.overflow && r.overflow.top > 1 && r.overflow.top <= 3 &&
              nearZero(r.overflow.left) && nearZero(r.overflow.right) &&
              nearZero(r.overflow.bottom) &&
              Number.isFinite(r.overflowPx) && r.overflowPx <= 3 &&
              r.tolerancePx === 3 &&
              r.inlineGeometry?.lookupStatus === 'matched';
            const malformed = Array.isArray(records) ? records.filter(r=>!validRecord(r)) : [];
            const eligibleStillReported = issues.filter(issue =>
              issue.kind === 'containment-rounding' &&
              issue.childType === 'note-marker' &&
              ['p-cut','p-end'].includes(issue.parentType) &&
              issue.overflow?.top > 1 && issue.overflow?.top <= 3 &&
              nearZero(issue.overflow?.left) && nearZero(issue.overflow?.right) &&
              nearZero(issue.overflow?.bottom) &&
              issue.inlineGeometry?.lookupStatus === 'matched');
            const missingTargets = item.expectedPages.filter(pageIdx =>
              !Array.isArray(records) || !records.some(r=>r.pageIdx===pageIdx));
            if (!check || check.enabled !== true || check.tolerancePx !== 3 ||
                !Array.isArray(records) || check.toleratedCount !== records.length ||
                check.findingCount !== issues.filter(issue=>issue.kind==='containment-rounding').length ||
                malformed.length || eligibleStillReported.length || missingTargets.length) {
              console.error('Note-marker tolerance contract failed:', item.file, {
                check, malformed: malformed.slice(0,10), eligibleStillReported,
                missingTargets
              });
              process.exit(1);
            }
            console.log(JSON.stringify({
              file:item.file, toleratedCount:check.toleratedCount,
              remainingContainmentRoundingFindings:check.findingCount,
              verifiedTargetPages:item.expectedPages,
              narrowToleranceGate:'PASS'
            }));
          }
          NODE
      - name: Build actual rendered-page issue screenshot PDF
        if: always()
        run: |
          python -m pip install --disable-pip-version-check reportlab
          python tools/build_layout_issue_screenshot_report.py \
            --manifest artifacts/issue-screenshots/default/manifest.json \
            --manifest artifacts/issue-screenshots/ornaments/manifest.json \
            --output artifacts/layout-issue-screenshot-report.pdf \
            --combined-manifest artifacts/layout-issue-screenshot-manifest.json
      - name: Assert step-audit suppression is explicit in ornament full-document report
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const file = './artifacts/geometry-audit-ornaments.json';
          const report = JSON.parse(fs.readFileSync(file, 'utf8'));
          const mode = report.run?.stepAudit;
          const issues = report.audit?.issues || [];
          const malformed = issues.filter(issue =>
            issue.stepByStepTrace?.traceAvailable !== false ||
            issue.stepByStepTrace?.reason !== 'step-audit-disabled-by-request' ||
            typeof issue.stepByStepTrace?.detail !== 'string' ||
            !issue.stepByStepTrace.detail.includes('Full-document workflow disables step tracing'));
          if (!mode || mode.enabled !== false || mode.disabledByRequest !== true ||
              mode.disableReason !== 'full-document-stability-policy' || malformed.length) {
            console.error('Ornament full-document trace suppression must be explicit:', {
              file, mode, issueCount: issues.length, malformedTraceSamples: malformed.slice(0, 10)
            });
            process.exit(1);
          }
          console.log(JSON.stringify({file, stepAudit: mode, issueCount: issues.length,
            allIssuesExplicitlyMarkedTraceDisabled: true, tracePolicyGate: 'PASS'}));
          NODE
      - name: Assert global-justify rollback residuals are explicitly diagnosed
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('./artifacts/geometry-audit-ornaments.json', 'utf8'));
          const issues = report.audit?.issues || [];
          const parseDiagnostic = value => {
            if (value && typeof value === 'object') return value;
            if (typeof value !== 'string') return null;
            try { return JSON.parse(value); } catch (_) { return null; }
          };
          const rollbackResiduals = issues.filter(issue => {
            if (issue.kind !== 'imbalance') return false;
            const diagnostic = parseDiagnostic(issue.layoutMetrics?.globalJustifyDiagnostic);
            return diagnostic?.rollback?.outerGrowth === true &&
              diagnostic?.rollback?.tallestGrowth === true;
          });
          const misclassified = rollbackResiduals.filter(issue =>
            issue.balanceOutcome !== 'global-justify-rollback-residual' ||
            issue.balanceDiagnosis?.source !== 'global-justify-diagnostic' ||
            issue.balanceDiagnosis?.reason !== 'rollback-after-outer-and-tallest-growth');
          if (misclassified.length) {
            console.error('Global-justify rollback residuals lack explicit diagnosis:', misclassified.map(issue => ({
              pageIdx: issue.pageIdx,
              diff: issue.diff,
              balanceOutcome: issue.balanceOutcome,
              balanceDiagnosis: issue.balanceDiagnosis
            })));
            process.exit(1);
          }
          console.log(JSON.stringify({
            globalJustifyRollbackResidualCount: rollbackResiduals.length,
            allExplicitlyDiagnosed: true,
            findingsRemainInIssueInventory: true,
            diagnosticGate: 'PASS'
          }));
          NODE
      - name: Assert terminal section-divider gaps are excluded only across verified boundaries
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const cases = [
            {file:'./artifacts/geometry-audit.json', expectedExcluded:[590],
              requiredFindings:[{pageIdx:589,pageLabel:'תקפח',gapPx:177,to:'body-flow-bottom'}]},
            {file:'./artifacts/geometry-audit-ornaments.json', expectedExcluded:[588,608,628]}
          ];
          for (const item of cases) {
            const report = JSON.parse(fs.readFileSync(item.file,'utf8'));
            const check = report.audit?.checks?.containerGap;
            const issues = report.audit?.issues || [];
            const excluded = check?.excludedPages || [];
            const findings = issues.filter(issue=>issue.kind==='container-gap');
            const expectedMissing = item.expectedExcluded.filter(pageIdx =>
              !excluded.some(page=>page.pageIdx===pageIdx &&
                page.reason==='section-end-before-divider' &&
                page.hasTerminalSectionDivider===true &&
                Number.isInteger(page.boundaryPageIndex) &&
                page.interveningBlankPageClass?.includes('blank-page') &&
                page.boundaryPageClass?.includes('sub-shaar-page')));
            const wronglyReported = findings.filter(issue=>item.expectedExcluded.includes(issue.pageIdx));
            const missingRequiredFindings = (item.requiredFindings || []).filter(expected =>
              !findings.some(issue => issue.pageIdx === expected.pageIdx && issue.pageLabel === expected.pageLabel &&
                issue.to === expected.to && Math.abs(issue.gapPx - expected.gapPx) <= 0.5 &&
                issue.hasVisibleFootnotes === false));
            const targetFindingsIncorrectlyExcluded = (item.requiredFindings || []).filter(expected =>
              excluded.some(page => page.pageIdx === expected.pageIdx));
            const unsupportedBlankExclusions = excluded.filter(page =>
              page.reason==='section-end-before-divider' &&
              page.interveningBlankPageClass?.includes('blank-page') &&
              (page.hasTerminalSectionDivider!==true ||
               !page.boundaryPageClass?.includes('sub-shaar-page') ||
               !Number.isInteger(page.boundaryPageIndex)));
            if (!check || expectedMissing.length || wronglyReported.length || missingRequiredFindings.length ||
                targetFindingsIncorrectlyExcluded.length || unsupportedBlankExclusions.length) {
              console.error('Terminal section boundary classification failed:',item.file,{
                expectedMissing,wronglyReported,missingRequiredFindings,
                targetFindingsIncorrectlyExcluded,unsupportedBlankExclusions
              });
              process.exit(1);
            }
            console.log(JSON.stringify({
              file:item.file,
              expectedTerminalBoundaryPages:item.expectedExcluded,
              requiredFindingsPreserved:(item.requiredFindings || []).map(item => ({
                pageIdx:item.pageIdx,pageLabel:item.pageLabel,gapPx:item.gapPx
              })),
              unsupportedBlankExclusions:unsupportedBlankExclusions.length,
              sectionBoundaryGate:'PASS'
            }));
          }
          NODE
      - name: Assert container-gap diagnostics account for every page
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          for (const file of ['./artifacts/geometry-audit.json', './artifacts/geometry-audit-ornaments.json']) {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            const check = report.audit?.checks?.containerGap;
            const reasonCount = check?.notEvaluatedReasons && typeof check.notEvaluatedReasons === 'object'
              ? Object.values(check.notEvaluatedReasons).reduce((sum, count) => sum + (Number.isInteger(count) && count > 0 ? count : 0), 0)
              : 0;
            const notEvaluatedPages = check?.notEvaluatedPages;
            const excludedPages = check?.excludedPages;
            const validExclusionRecord = page => {
              if (!page || !Number.isInteger(page.pageIdx) || typeof page.reason !== 'string') return false;
              if (page.reason === 'explicit-special-page-role') {
                return typeof page.specialPageType === 'string' &&
                  typeof page.pageClass === 'string' &&
                  page.boundaryPageClass == null;
              }
              if (page.reason === 'section-end-before-divider') {
                return page.specialPageType === 'section-divider-page' &&
                  page.pageClass == null &&
                  page.hasTerminalSectionDivider === true &&
                  Number.isInteger(page.boundaryPageIndex) &&
                  typeof page.boundaryPageClass === 'string' &&
                  page.boundaryPageClass.includes('sub-shaar-page') &&
                  (page.interveningBlankPageClass == null ||
                   (typeof page.interveningBlankPageClass === 'string' &&
                    page.interveningBlankPageClass.includes('blank-page')));
              }
              if (page.reason === 'chapter-end' || page.reason === 'document-end') {
                return page.specialPageType == null &&
                  page.pageClass == null &&
                  page.boundaryPageClass == null;
              }
              if (page.reason === 'no-visible-body-text') {
                return page.specialPageType == null &&
                  typeof page.pageClass === 'string' &&
                  page.boundaryPageClass == null &&
                  Number.isInteger(page.candidateTextElementCount) &&
                  page.candidateTextElementCount >= 0 &&
                  page.visibleTextElementCount === 0 &&
                  Number.isFinite(page.bodyFlowHeightPx) &&
                  page.bodyFlowHeightPx > 0;
              }
              return false;
            };
            if (!check || !Array.isArray(excludedPages) ||
                excludedPages.length !== check.pagesExcluded ||
                excludedPages.some(page => !validExclusionRecord(page))) {
              console.error('Page exclusion records are missing, malformed, or inconsistent with their reason:', file, {
                pagesExcluded: check?.pagesExcluded,
                excludedPages: Array.isArray(excludedPages) ? excludedPages.length : null,
                malformedSamples: Array.isArray(excludedPages)
                  ? excludedPages.filter(page => !validExclusionRecord(page)).slice(0, 10)
                  : null,
                contract: {
                  explicitSpecialRole: 'specialPageType + pageClass; no boundaryPageClass',
                  sectionEndBeforeDivider: 'section-divider-page + boundaryPageClass containing sub-shaar-page',
                  chapterOrDocumentEnd: 'no special-page metadata',
                  noVisibleBodyText: 'no special-page metadata + zero visible text matches + finite positive body-flow height'
                }
              });
              process.exit(1);
            }
            if (!Array.isArray(notEvaluatedPages) ||
                notEvaluatedPages.length !== check.pagesNotEvaluated ||
                notEvaluatedPages.some(page =>
                  !Number.isInteger(page.pageIdx) ||
                  typeof page.reason !== 'string' ||
                  !Number.isInteger(page.bodyFlowCount) ||
                  !Array.isArray(page.directChildClasses))) {
              console.error('Per-page incomplete-coverage diagnostics are missing or inconsistent:', file, {
                pagesNotEvaluated: check?.pagesNotEvaluated,
                notEvaluatedPages: Array.isArray(notEvaluatedPages) ? notEvaluatedPages.length : null
              });
              process.exit(1);
            }
            if (!check || check.enabled !== true || check.pageCount !== report.pageCount ||
                !Number.isInteger(check.pagesEvaluated) || check.pagesEvaluated < 0 ||
                !Number.isInteger(check.pagesNotEvaluated) || check.pagesNotEvaluated < 0 ||
                !Number.isInteger(check.pagesExcluded) || check.pagesExcluded < 0 ||
                check.pagesEvaluated + check.pagesExcluded + check.pagesNotEvaluated !== check.pageCount ||
                reasonCount !== check.pagesNotEvaluated ||
                check.coverageComplete !== (check.pagesNotEvaluated === 0) ||
                !Number.isFinite(check.warningThresholdPx) ||
                !Number.isFinite(check.mediumThresholdPx) ||
                check.findingCount !== (report.audit?.issues || []).filter(issue => issue.kind === 'container-gap').length) {
              console.error('Container-gap accounting is missing, incomplete, or inconsistent:', file, check);
              process.exit(1);
            }
            const hasFiniteRect = node => node && [
              'leftFromFlowPx', 'rightFromFlowPx', 'topFromFlowPx', 'bottomFromFlowPx',
              'widthPx', 'heightPx'
            ].every(key => Number.isFinite(node[key])) &&
              node.widthPx >= 0 && node.heightPx >= 0;
            const hasComputedLayout = node => node && node.computedLayout &&
              typeof node.computedLayout.display === 'string' &&
              typeof node.computedLayout.position === 'string' &&
              typeof node.computedLayout.boxSizing === 'string' &&
              typeof node.computedLayout.width === 'string' &&
              typeof node.computedLayout.height === 'string';
            const isMeasuredRectNode = node => hasFiniteRect(node) &&
              typeof node.tag === 'string' && typeof node.className === 'string';
            const isMeasuredNode = node => isMeasuredRectNode(node) && hasComputedLayout(node);
            const isMeasuredColumn = column => isMeasuredNode(column) &&
              Number.isInteger(column.visibleTextElementCount) &&
              column.visibleTextElementCount >= 0 &&
              (column.lastVisibleTextElement === null ||
               column.lastVisibleTextElement === undefined ||
               hasFiniteRect(column.lastVisibleTextElement));
            const isMeasuredChild = node => isMeasuredNode(node) &&
              Array.isArray(node.columns) &&
              node.columns.every(isMeasuredColumn) &&
              (!String(node.className).includes('block-2col') || node.columns.length >= 2);
            const malformed = (report.audit?.issues || []).filter(issue => {
              if (issue.kind !== 'container-gap') return false;
              const context = issue.gapContext;
              if (!Number.isFinite(issue.gapPx) || issue.gapPx <= check.warningThresholdPx ||
                  !['low', 'medium'].includes(issue.severity) ||
                  !['footnote-area-top', 'body-flow-bottom'].includes(issue.to) ||
                  !context || context.contextSchemaVersion !== 2) return true;
              if (!isMeasuredNode(context.lastTextElement) ||
                  !isMeasuredNode(context.bodyFlow) ||
                  !hasComputedLayout({computedLayout: context.lastTextComputedLayout})) return true;
              if (!Array.isArray(context.lastTextAncestorChain) ||
                  context.lastTextAncestorChain.length < 1 ||
                  context.lastTextAncestorChain.some(node => !isMeasuredNode(node))) return true;
              if (!Array.isArray(context.currentBodyFlowChildren) ||
                  context.currentBodyFlowChildren.length < 1 ||
                  context.currentBodyFlowChildren.some(node => !isMeasuredChild(node))) return true;
              if (context.nextPage !== null) {
                if (!context.nextPage || typeof context.nextPage !== 'object' ||
                    typeof context.nextPage.pageClass !== 'string' ||
                    typeof context.nextPage.hasBodyFlow !== 'boolean' ||
                    !Array.isArray(context.nextPage.bodyFlowChildren) ||
                    context.nextPage.bodyFlowChildren.some(node => !isMeasuredChild(node))) return true;
              }
              return false;
            });
            if (malformed.length) {
              console.error('Malformed container-gap finding:', file, malformed.slice(0, 5));
              process.exit(1);
            }
            console.log(JSON.stringify({file, pageCount: check.pageCount, pagesEvaluated: check.pagesEvaluated,
              pagesNotEvaluated: check.pagesNotEvaluated, notEvaluatedReasons: check.notEvaluatedReasons,
              coverageComplete: check.coverageComplete,
              warningThresholdPx: check.warningThresholdPx, mediumThresholdPx: check.mediumThresholdPx,
              findingCount: check.findingCount,
              findingsWithStructuralContext: (report.audit?.issues || []).filter(issue =>
                issue.kind === 'container-gap' && issue.gapContext?.contextSchemaVersion === 2).length,
              pagesExcluded: check.pagesExcluded, excludedReasons: check.excludedReasons,
              excludedPageSamples: excludedPages.slice(0, 25),
              notEvaluatedPageSamples: notEvaluatedPages.slice(0, 25).map(page => ({
                pageIdx: page.pageIdx, pageLabel: page.pageLabel, reason: page.reason,
                domPageIndex: page.domPageIndex, pageClass: page.pageClass,
                directChildClasses: page.directChildClasses, bodyFlowCount: page.bodyFlowCount,
                visibleTextElementCount: page.visibleTextElementCount, pageTextPreview: page.pageTextPreview
              })),
              accountingGate: 'PASS',
              geometryCoverage: check.coverageComplete ? 'COMPLETE' : 'INCOMPLETE_REQUIRES_FOLLOWUP'}));
          }
          NODE
      - name: Assert sparse-page diagnostics account for every page and preserve chapter-end policy
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const files = ['./artifacts/geometry-audit.json', './artifacts/geometry-audit-ornaments.json'];
          const knownRoles = new Map([
            ['a4-page main-shaar-page','main-title-page'], ['a4-page back-shaar-page','back-title-page'],
            ['a4-page sub-shaar-page','section-divider-page'], ['a4-page blank-page','intentional-blank-page']
          ]);
          for (const file of files) {
            const report = JSON.parse(fs.readFileSync(file,'utf8'));
            const check = report.audit?.checks?.sparsePage;
            const issues = (report.audit?.issues || []).filter(issue=>issue.kind==='sparse-page');
            const evaluated = check?.pagesEvaluated, excluded = check?.pagesExcluded, notEvaluated = check?.pagesNotEvaluated;
            const excludedPages = check?.excludedPages, notEvaluatedPages = check?.notEvaluatedPages;
            const validSpecialRole = page => page.reason === 'explicit-special-page-role' && knownRoles.get(page.pageClass) === page.specialPageType;
            const validChapterEndFill = page => page.reason === 'section-end-before-divider' && page.chapterEndBalanceMode === 'fill' &&
              page.hasTerminalSectionDivider === true && Number.isInteger(page.boundaryPageIndex) && page.boundaryPageClass?.includes('sub-shaar-page') &&
              (page.interveningBlankPageClass == null || page.interveningBlankPageClass.includes('blank-page'));
            const malformedExclusions = (excludedPages || []).filter(page => !validSpecialRole(page) && !validChapterEndFill(page) &&
              !['chapter-end','document-end','no-visible-text'].includes(page.reason));
            const invalidChapterModeFindings = issues.filter(issue => issue.isChapterEnd === true && issue.chapterEndBalanceMode !== 'balance');
            const missingChapterEvidence = issues.filter(issue => issue.isChapterEnd === true &&
              (typeof issue.chapterEndBalanceMode !== 'string' || issue.hasTerminalSectionDivider !== true ||
               !Number.isInteger(issue.boundaryPageIndex) || !issue.boundaryPageClass?.includes('sub-shaar-page')));
            if (!check || check.pageCount !== report.pageCount || evaluated + excluded + notEvaluated !== report.pageCount ||
                excludedPages?.length !== excluded || notEvaluatedPages?.length !== notEvaluated || notEvaluated !== 0 ||
                check.coverageComplete !== true || malformedExclusions.length || invalidChapterModeFindings.length || missingChapterEvidence.length) {
              console.error('Sparse-page coverage or policy contract failed:',file,{pageCount:report.pageCount,evaluated,excluded,notEvaluated,
                excludedRecords:excludedPages?.length,notEvaluatedRecords:notEvaluatedPages?.length,coverageComplete:check?.coverageComplete,
                malformedExclusions,invalidChapterModeFindings,missingChapterEvidence}); process.exit(1);
            }
            console.log(JSON.stringify({file,pageCount:report.pageCount,evaluated,excluded,notEvaluated,
              sparseFindings:issues.length,chapterEndFindings:issues.filter(i=>i.isChapterEnd).length,sparseCoverage:'PASS'}));
          }
          NODE
      # Deferred by the explicit V23 work constraint: do not investigate DOM page 376
      # until all other issue families are resolved and the deferral is deliberately lifted.
      - name: Run targeted causal trace for known medium imbalance
        if: false
        run: |
          node tools/geometry-audit-cli.js \
            --input ./very_long_test_text.txt \
            --settings ./tests/fixtures/ornament-geometry-settings.json \
            --timeout-ms 900000 \
            --report ./artifacts/geometry-audit-targeted-trace.json \
            --summary ./artifacts/geometry-audit-targeted-trace-summary.md \
            --fail-on high \
            --step-audit-page-indexes 376 \
            --step-audit-max-events 1500 \
            --step-audit-max-elements 600 \
            --step-audit-no-line-rects \
            --step-audit-no-computed-style
          node - <<'NODE'
          const fs = require('node:fs');
          const file = './artifacts/geometry-audit-targeted-trace.json';
          const report = JSON.parse(fs.readFileSync(file, 'utf8'));
          const mode = report.run?.stepAudit;
          const traces = report.geometry?.stepByStepAudit;
          const targetIssues = (report.audit?.issues || []).filter(issue =>
            issue.pageIdx === 376 && issue.kind === 'imbalance');
          const malformed = targetIssues.filter(issue =>
            issue.stepByStepTrace?.traceAvailable !== true ||
            issue.stepByStepTrace?.traceComplete !== true ||
            issue.stepByStepTrace?.droppedEvents !== 0 ||
            !Array.isArray(issue.stepByStepTrace?.targetTouchEventIndexes) ||
            issue.stepByStepTrace.targetTouchEventIndexes.length === 0 ||
            !Array.isArray(issue.stepByStepTrace?.relatedTokenIds) ||
            issue.stepByStepTrace.relatedTokenIds.length === 0);
          const targetPages = (traces?.pages || []).map(page => page.pageIndex);
          if (!mode || mode.enabled !== true || mode.disabledByRequest !== false ||
              JSON.stringify(mode.targetPageIndexes) !== JSON.stringify([376]) ||
              !Array.isArray(traces?.pages) || targetPages.length !== 1 || targetPages[0] !== 376 ||
              !traces.pages[0].eventCount || traces.pages[0].droppedEvents !== 0 ||
              !targetIssues.length || malformed.length) {
            console.error('Targeted causal trace is missing, incomplete, or not isolated to the requested page:', {
              mode, targetPages, traceSummary: traces?.summary,
              targetIssueCount: targetIssues.length,
              malformed: malformed.map(issue => ({
                pageIdx: issue.pageIdx, kind: issue.kind, trace: issue.stepByStepTrace
              }))
            });
            process.exit(1);
          }
          console.log(JSON.stringify({
            targetPageIndex: 376,
            targetIssueCount: targetIssues.length,
            eventCount: traces.pages[0].eventCount,
            droppedEvents: traces.pages[0].droppedEvents,
            traceComplete: true,
            relatedTokenIds: targetIssues[0].stepByStepTrace.relatedTokenIds,
            targetTouchEventIndexes: targetIssues[0].stepByStepTrace.targetTouchEventIndexes,
            causalityPolicy: 'related paragraph events linked; causal trigger still requires evidence-based interpretation',
            targetedTraceGate: 'PASS'
          }));
          NODE
      - name: Archive rendered issue screenshot PDF in V23
        if: always() && hashFiles('artifacts/layout-issue-screenshot-report.pdf', 'artifacts/layout-issue-screenshot-manifest.json') != ''
        run: |
          set -euo pipefail
          ISSUE_KINDS="$(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('artifacts/layout-issue-screenshot-manifest.json').read_text(encoding='utf-8'))
          print('_'.join(k.replace('/', '-') for k in data.get('issueKinds', [])) or 'no-classified-issues')
          PY
          )"
          REPORT_DIR="V23/reports/${ISSUE_KINDS}_$(date -u +%F)_run-${GITHUB_RUN_ID}"
          mkdir -p "$REPORT_DIR"
          cp artifacts/layout-issue-screenshot-report.pdf "$REPORT_DIR/layout-issue-screenshot-report.pdf"
          cp artifacts/layout-issue-screenshot-manifest.json "$REPORT_DIR/layout-issue-screenshot-manifest.json"
          cat > "$REPORT_DIR/README.md" <<EOF
          # Rendered layout-issue screenshots

          - Source repository/ref/commit/run are recorded in the JSON manifest.
          - The PDF embeds genuine screenshots captured from rendered `.a4-page` DOM elements in Chromium; it does not use diagrams or reconstructed page images.
          - The report selects up to three distinct pages per issue kind and excludes deferred DOM page indexes 375 and 376.
          - The JSON manifest maps each PDF page to its source screenshot, measured issue data, configuration, commit and run.
          - This is a diagnostic review report, not a claim that every finding is confirmed or resolved.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$REPORT_DIR"
          if git diff --cached --quiet; then
            echo "No screenshot report changes to commit."
            exit 0
          fi
          git commit -m "V23: archive rendered layout issue screenshots"
          git push origin "HEAD:V23"
      - name: Upload long-document audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geometry-audit-long-report
          path: |
            artifacts/geometry-audit.json
            artifacts/geometry-audit-summary.md
            artifacts/geometry-audit-ornaments.json
            artifacts/geometry-audit-ornaments-summary.md
            artifacts/geometry-audit-targeted-trace.json
            artifacts/geometry-audit-targeted-trace-summary.md
            artifacts/run-fingerprint.json
            artifacts/issue-screenshots/
            artifacts/layout-issue-screenshot-report.pdf
            artifacts/layout-issue-screenshot-manifest.json
          if-no-files-found: warn
